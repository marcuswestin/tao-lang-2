name: Companion hosts

# Build and check the host kit nightly on `main` and on demand through `workflow_dispatch`. Pull
# requests no longer start it: each job ran about twenty-five minutes against a commit that was
# usually not the one that merged, the result gated nothing (`Verify` is the only required check),
# and the Android job took a runner from Verify's pool for the whole build. The native-kit parity
# test it also ran lives in the verification tests, which `Verify` runs on every pull request.
# Release publication stays separate until the repository and its compatible hosts are public.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} host and native-kit parity
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios-simulator
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Set up Tao
        run: devenv shell -- ./agent setup
      - name: Check native-kit parity
        run: devenv shell -- ./agent test-file packages/testing/verification/verification-tests/companion-native-parity.test.ts
      - name: Build ${{ matrix.platform }} host
        run: devenv shell -- ./agent unsandboxed companion-host-build --platform ${{ matrix.platform }}
