name: Pull request

# The first half of Tao's continuous integration: the GitHub side of the wiring, proven on its own
# before any lane runs here. It deliberately verifies nothing. Tao's gates need the devenv profile
# and, for the iOS lanes, a macOS image that is built elsewhere; until that image exists this
# workflow only shows that a pull request reaches Actions, checks out the repository, and reports a
# result. `./agent land` remains the gate that decides whether work is fit to land.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    name: Pipeline reachable (verifies nothing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Say plainly what this run did and did not do
        run: |
          echo "This job proves the GitHub side of the pipeline only."
          echo "It ran no gate: not check, not typecheck, not a test suite, not a host lane."
          echo "A green result here says a pull request reached Actions and the checkout worked."
          echo "Run './agent verify' locally for evidence about the code."
          test -f AGENTS.md
