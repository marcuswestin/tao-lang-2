name: Verify

# Runs verify-full's portable membership (`./agent verify-full-sandbox`) split across Linux
# runners, so an agent on a small machine can open a pull request and read one verdict instead of
# running the full lane itself. Each partition runs the whole prepare phase and its own share of the
# readers; the final `Verify` job is the one verdict, and it refuses a set of partitions that did not
# compute the same plan, because a disagreement there means some node ran nowhere.
#
# What this does not prove: the host-only lanes (Studio smokes, browser, native shell, canary),
# which need a window server and an unsandboxed host. The landing route runs those locally while
# this workflow runs (`agents/skills/verification-lanes/references/hosted-verification.md`).
#
# The contributor-agreement check is a job here rather than a workflow of its own, so a push to a
# pull request shows as one run in the Actions list instead of two. It runs on the same token as
# the partitions, which a fork's pull request receives read-only; the job then still decides, and
# only its explanatory comment is lost (`CONTRIBUTING.md` says the same thing).
#
# The partition count is one number, `PARTITIONS` below, read by the `plan` job; nothing else in
# this file states it. Never cache `.artifacts`: the plan reads recorded timings, and partitions
# that restored different ones would place nodes differently. Each partition instead seeds them
# from `.github/verify/durations.json` and `ledger.json`.

on:
  pull_request:
    # Not `ready_for_review`: every push already ran Verify, and marking a draft ready changes no code.
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      partitions:
        description: Partition count for this run only; blank uses the repository variable or the default below.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A dispatched run is an experiment and gets its own group, so it never queues behind main's
  # push runs (a dispatch on 2026-10-06 waited 862 s for one) and never delays them.
  group: verify-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  # PR updates replace obsolete proof; main keeps up to 100 pending runs instead of dropping one.
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # How many Linux runners split the readers. The number comes from measurements, not a guess:
  # `Docs/Roadmap/Verification speed research.md` §16 and `.github/verify/durations.json`.
  #
  # The lane's portable work is about 2,900 s of suite and gate time, and every partition first
  # pays about 115 s on its own: checkout and cache restores (about 25 s), a warm bootstrap
  # (about 35 s), and the prepare phase (about 50 s). A run's wall time is therefore about
  # ceil(N / concurrency) waves of (115 + 2,900 / N) seconds, times the imbalance of the plan (the
  # slowest partition ran 2.2x the median on 2026-10-06), bounded below by the longest
  # unsplittable node (runtime-jest, about 110 s) plus the fixed cost:
  #
  #   concurrency 11 (measured on 2026-10-06: 11 jobs start together, the twelfth queues):
  #     N = 10  one wave, about 405 s, one slot left for the small jobs that share the limit
  #             (the aggregate, the contributor agreement, Archive merged branch)
  #     N = 11  one wave only while nothing else runs; any other job adds a second wave
  #     N = 12  two waves, about 760 s (the second wave is one partition the others wait for)
  #   concurrency 20 or more (the Team plan documents 60 total jobs):
  #     N = 18  about 275 s;  N = 24  about 235 s, then the fixed cost dominates.
  #
  # Set the repository Actions variable VERIFY_PARTITIONS (Settings → Secrets and variables →
  # Actions) to 18 once a run shows 19 or more jobs starting together, and leave this default as
  # the documented fallback. A `workflow_dispatch` run takes a one-run override.
  PARTITIONS: 10
  # Per-gate green records travel between runs of the same tree through the Actions cache, which
  # accepts only an absolute path with no `..` in it.
  TAO_GREEN_STORE: /home/runner/tao-green
  # Bun's download cache, restored before the bootstrap installs from it. npm's is not cached: the
  # Tao projects' pins install without their peers, a few hundred kilobytes downloaded in a second.
  BUN_INSTALL_CACHE_DIR: /home/runner/tao-cache/bun
  # Every directory Bun's isolated linker writes: the root store and each workspace's own links,
  # which point into it by relative paths, so the tree restores intact at the same checkout path.
  NODE_MODULES_PATHS: |
    node_modules
    packages/*/node_modules
    packages/*/*/node_modules
    packages/apps/providers/*/node_modules
    Apps/Hosted CRUD/node_modules

jobs:
  # Holds a pull request until its author has accepted CLA.md by posting the agreement sentence on a
  # pull request in this repository. The comment is the signature: GitHub authenticates who posted
  # it, timestamps it, and keeps its edit history. It is this job's result, not a commit status, so a
  # ruleset can require "Contributor agreement" on `main` by that name once the repository is
  # public. A sentence posted after this ran counts on the next push, or when a maintainer re-runs
  # the failed jobs of this run. Not on `edited`: a title change is not new code, and this workflow's
  # other jobs would fan out with it.
  cla:
    name: Contributor agreement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      CLA_SENTENCE: I have read the Tao Contributor License Agreement, version 1.0, and I agree to it.
      MARKER: '<!-- tao-cla -->'
    steps:
      - name: Check the author has accepted the agreement
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # The repository belongs to an organization, so the maintainer is named rather than read
          # from the owner, which is now the organization's login.
          MAINTAINER: marcuswestin
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each check reads a whole value first: grep -q in a pipeline would end it early and fail it.
          signed() { grep -qiF -- "$CLA_SENTENCE" <<<"$1"; }
          comments_by() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq ".[] | select(.user.login == \"$AUTHOR\") | .body"
          }
          # The maintainer holds the rights already.
          accepted=false
          if [ "$AUTHOR" = "$MAINTAINER" ]; then
            accepted=true
          # This pull request's description, or a comment on it, by its author.
          elif signed "$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""')" || signed "$(comments_by "$NUMBER")"; then
            accepted=true
          else
            # An earlier pull request where the author accepted it.
            for other in $(gh api -X GET search/issues \
                -f q="repo:$REPO is:pr involves:$AUTHOR \"$CLA_SENTENCE\"" --jq '.items[].number'); do
              body=$(gh api "repos/$REPO/pulls/$other" --jq "select(.user.login == \"$AUTHOR\") | .body")
              if signed "$body" || signed "$(comments_by "$other")"; then
                accepted=true
                break
              fi
            done
          fi

          if [ "$accepted" = true ]; then
            echo "@$AUTHOR has accepted the agreement."
            exit 0
          fi

          echo "::error::@$AUTHOR has not accepted CLA.md. Post the agreement sentence as a comment on this pull request, then push or re-run this job."
          # Explain once on the pull request; a fork's read-only token cannot, and this log says it then.
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[].body')
          if ! grep -qF -- "$MARKER" <<<"$existing"; then
            gh pr comment "$NUMBER" --repo "$REPO" --body "$MARKER
          Thank you for the pull request, @$AUTHOR. Before it can be merged, please read the
          [Tao Contributor License Agreement](https://github.com/$REPO/blob/main/CLA.md) and, if you agree,
          post this sentence as a comment, exactly as written:

          > $CLA_SENTENCE

          Then push again or ask a maintainer to re-run the \"Contributor agreement\" check. It covers this
          and every later contribution. You keep the copyright in your work; the agreement lets the
          maintainer license Tao, your contribution included, under any terms." \
              || echo "::warning::Could not post the explanation on the pull request; the token is read-only."
          fi
          exit 1

  # Turns the one partition count into the matrix the partitions fan out over. A matrix cannot read
  # `env`, so this job is the only place the count is resolved; it also records the override that
  # applied, so a run's summary says how it was split.
  plan:
    name: Plan the partitions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      count: ${{ steps.plan.outputs.count }}
      partitions: ${{ steps.plan.outputs.partitions }}
    steps:
      - name: Resolve the partition count
        id: plan
        env:
          RUN_OVERRIDE: ${{ inputs.partitions }}
          REPOSITORY_OVERRIDE: ${{ vars.VERIFY_PARTITIONS }}
        run: |
          if [ -n "$RUN_OVERRIDE" ]; then
            count=$RUN_OVERRIDE; source="this run's dispatch input"
          elif [ -n "$REPOSITORY_OVERRIDE" ]; then
            count=$REPOSITORY_OVERRIDE; source="the repository variable VERIFY_PARTITIONS"
          else
            count=$PARTITIONS; source="the workflow default"
          fi
          case "$count" in
            ''|*[!0-9]*|0) echo "::error::Partition count must be a positive integer, got '$count' from $source."; exit 1 ;;
          esac
          if [ "$count" -gt 40 ]; then
            echo "::error::Partition count $count from $source exceeds 40; fixed cost dominates long before that."
            exit 1
          fi
          echo "Splitting the readers across $count partitions ($source)."
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "partitions=$(seq 1 "$count" | jq -cs .)" >> "$GITHUB_OUTPUT"

  partition:
    name: Partition ${{ matrix.partition }}/${{ needs.plan.outputs.count }}
    needs: plan
    # x86-64, not ARM: the Hermes compiler `ship-bundle-proof` runs ships no Linux ARM binary.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PARTITION: ${{ matrix.partition }}/${{ needs.plan.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.partitions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Identify the tree
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore green records for this tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TAO_GREEN_STORE }}
          key: tao-green-${{ runner.os }}-${{ runner.arch }}-${{ steps.tree.outputs.hash }}-${{ matrix.partition }}-of-${{ needs.plan.outputs.count }}
          restore-keys: |
            tao-green-${{ runner.os }}-${{ runner.arch }}-${{ steps.tree.outputs.hash }}-

      # The installed tree itself, keyed on everything Bun installs it from: the lockfile, every
      # workspace manifest, and the devenv lock that pins Bun and Node. Setup finds a tree with no
      # completion stamp, runs its health probe, and adopts the tree without installing. Never given
      # restore-keys: a tree restored from another lockfile would pass that probe just the same.
      # `Companion hosts` restores the same key, so the two workflows share one installed tree.
      - name: Restore the installed node_modules
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: tao-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'devenv.lock', 'package.json', 'packages/*/package.json', 'packages/*/*/package.json', 'packages/apps/providers/*/package.json', 'Apps/Hosted CRUD/package.json') }}

      # Bun's download cache matters only when it has to install, so it is restored only then.
      - name: Restore Bun's download cache
        id: bun-cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/tao-cache/bun
          key: tao-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            tao-bun-${{ runner.os }}-${{ runner.arch }}-

      # The Nix installation and the built locked profile, keyed on everything that decides them: the
      # pinned Nix release, the devenv lock, and the profile's expressions. On a hit the installer
      # finds Nix present and the bootstrap reuses the profile generation, so it neither downloads nor
      # evaluates anything. Tar cannot create /nix itself, so it is made the runner's first; the
      # single-user installer accepts an existing directory it can write.
      - name: Prepare /nix for the Nix store cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /nix

      - name: Restore the Nix store and locked toolchain
        id: nix-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /nix
            ~/.nix-profile
            ~/.local/state/nix
            ${{ github.workspace }}/.devenv/portable-generations
          key: tao-nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'packages/cli/dev-cli/dev-cli-src/environment/nix-bootstrap.sh', 'packages/cli/dev-cli/dev-cli-src/environment/portable-profile.nix', 'packages/cli/dev-cli/dev-cli-src/environment/toolchain-packages.nix') }}

      # The maintained native bindings, a generated tree setup would otherwise write in 6–10 s. The
      # generator checks every input and output identity first and rewrites only a stale tree, so a
      # restore from another key, or none, costs a regeneration and never a stale binding.
      - name: Restore the generated native bindings
        id: native-bindings
        uses: actions/cache/restore@v4
        with:
          path: packages/apps/stdlib/.tao-ts/native-bindings
          key: tao-native-bindings-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/apps/native-bindings/native-bindings-src/**', 'packages/apps/stdlib/@tao/device/**') }}
          restore-keys: |
            tao-native-bindings-${{ runner.os }}-

      # Installs a checksum-pinned single-user Nix, builds the locked Linux profile, then prepares
      # only what the lane reads (`--verify-setup`): the full `./agent setup` also writes agent
      # configuration, Git hooks, and shell completion, which no gate reads.
      - name: Bootstrap Nix, the pinned toolchain, and Tao setup
        run: ./.config/bootstrap-tao-dev-env --install-nix --verify-setup

      - name: Save the generated native bindings
        if: steps.native-bindings.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: packages/apps/stdlib/.tao-ts/native-bindings
          key: ${{ steps.native-bindings.outputs.cache-primary-key }}

      # TEMPORARY measurement for the fixed-cost slice; removed before landing.
      - name: Measure the restored node_modules
        run: |
          du -sm node_modules | tail -n 1
          du -sm node_modules/.bun/* | sort -nr | head -n 40
          find node_modules/.bun -type f | wc -l
          du -sm "Apps/Test Apps/Native Bridge/.tao/cache/install" .devenv/portable-generations 2>/dev/null || true

      # Saved straight after the bootstrap, so a partition that later fails still warms the caches,
      # and before verification writes any tool cache under node_modules. All partitions share one
      # key; the first to finish saves it and the rest are refused harmlessly. Saved under the key
      # the restore computed: hashing the locks again here would read them after setup, and a setup
      # that rewrote one would save under a key no later restore looks for.
      - name: Save the installed node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Save Bun's download cache
        if: steps.bun-cache.outcome == 'success' && steps.bun-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/tao-cache/bun
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      # Collecting garbage first drops what only the build needed, chiefly the two unpacked nixpkgs
      # sources, so the cache holds Nix and the profile's closure. Both are rooted explicitly rather
      # than trusting where this Nix release keeps a single-user profile's roots.
      - name: Collect Nix garbage before saving the store
        id: nix-gc
        if: steps.nix-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          ln -sfn "$(readlink -f ~/.nix-profile)" /nix/var/nix/gcroots/tao-nix-profile
          ln -sfn "$(readlink -f .devenv/profile)" /nix/var/nix/gcroots/tao-portable-profile
          ~/.nix-profile/bin/nix-store --gc 2>&1 | tail -n 2
          test -x ~/.nix-profile/bin/nix-build
          test -x .devenv/profile/bin/bun

      - name: Save the Nix store and locked toolchain
        if: steps.nix-gc.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /nix
            ~/.nix-profile
            ~/.local/state/nix
            ${{ github.workspace }}/.devenv/portable-generations
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}

      # Every partition plans from this one committed snapshot of measured durations, so all of them
      # compute the same plan, and suites split into shards sized by cost rather than running whole.
      # The durations are CI's own suite and gate totals; the ledger holds only per-file relative
      # costs, under an identity no real file hashes to, so it shapes shards without skipping tests.
      - name: Seed the plan with the committed durations
        run: |
          mkdir -p .artifacts/timings .artifacts/testing
          cp .github/verify/durations.json .artifacts/timings/durations.json
          cp .github/verify/ledger.json .artifacts/testing/ledger.json

      - name: Verify partition ${{ env.PARTITION }}
        run: ./agent verify-full-sandbox --partition "$PARTITION"

      # Locally the prepare phase fixes formatting and regenerates indexes in place; here a rewrite
      # means the pull request carries unformatted or stale files, which is a failure.
      - name: Require the prepare phase to leave the tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The prepare phase rewrote tracked files; run ./agent fix and commit the result:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

      # Keep both attempts when a retry recovered a failed gate, even if the partition passed.
      # Failed partitions retain every gate log; clean passes need only their summary.
      - name: Collect the run's summary and failure or retry logs
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify-logs"
          latest=.artifacts/logs/verify-full-sandbox/latest
          if [ "$JOB_STATUS" = success ] && [ -e "$latest/summary.json" ]; then
            cp -L "$latest/summary.json" "$RUNNER_TEMP/verify-logs/"
            for log in "$latest"/*.initial.log "$latest"/*.retry.log; do
              if [ -f "$log" ]; then
                cp -L "$log" "$RUNNER_TEMP/verify-logs/"
              fi
            done
          elif [ -e "$latest" ]; then
            cp -RL "$latest/." "$RUNNER_TEMP/verify-logs/"
          fi

      - name: Upload the run's summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-partition-${{ matrix.partition }}
          path: ${{ runner.temp }}/verify-logs
          if-no-files-found: warn
          retention-days: 7

      # Only a partition that passed has anything new to save: the lane writes its green records in
      # one batch after every node passed, never as nodes finish, so a failed or cancelled partition
      # holds nothing but what it restored. The landing route cancels runs whose local complement
      # failed, and `always()` would have run this step then too, inside GitHub's cancellation
      # grace period; `success()` keeps a cancelled run from saving anything at all.
      - name: Save green records for this tree
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TAO_GREEN_STORE }}
          key: tao-green-${{ runner.os }}-${{ runner.arch }}-${{ steps.tree.outputs.hash }}-${{ matrix.partition }}-of-${{ needs.plan.outputs.count }}

  verify:
    name: Verify
    needs: [plan, partition]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PARTITIONS: ${{ needs.plan.outputs.count }}
    steps:
      - name: Download every partition's summary
        uses: actions/download-artifact@v4
        with:
          pattern: verify-partition-*
          path: partitions

      - name: Require every partition green and every plan identical
        env:
          PARTITION_RESULT: ${{ needs.partition.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          # One annotation per extracted failure, and one for each failed gate whose log matched no
          # recognized format, escaped as workflow commands require.
          cat > "$RUNNER_TEMP/annotate.jq" <<'JQ'
          def escape: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | .[0:2000];
          (.partition.index // "?") as $k
          | (.failures // []) as $failures
          | ($failures[] | "::error title=Partition \($k): \(.gate)::\((.test + (if .error then ": " + .error else "" end)) | escape)"),
            (.gates[] | select(.status == "failed") | .name as $gate
              | select([$failures[] | select(.gate == $gate)] | length == 0)
              | "::error title=Partition \($k): \($gate)::Failed with no recognized test failure; the partition's log artifact holds its output.")
          JQ
          status=0
          if [ "$PLAN_RESULT" != success ]; then
            echo "The plan job did not succeed ($PLAN_RESULT), so no partition ran."
            exit 1
          fi
          summaries=$(find partitions -name summary.json | sort)
          count=$(printf '%s\n' "$summaries" | grep -c . || true)
          if [ "$count" != "$PARTITIONS" ]; then
            echo "Expected $PARTITIONS partition summaries, found $count."
            status=1
          fi
          digests=$(for summary in $summaries; do jq -r '.partition.digest // "missing"' "$summary"; done | sort -u)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" != 1 ] || [ "$digests" = missing ]; then
            echo "Partitions disagreed about the plan, so some node may have run nowhere:"
            printf '%s\n' "$digests"
            status=1
          fi
          for summary in $summaries; do
            jq -r '"partition \(.partition.index // "?")/\(.partition.count // "?"): \(.status), \([.gates[] | select(.status == "passed")] | length) passed, \([.gates[] | select(.status == "failed")] | length) failed in \(.elapsedMs / 1000 | floor)s"' "$summary"
            jq -r '.gates[] | select(.status == "failed") | "  failed: \(.name)"' "$summary"
            # Annotations carry each failure's reason to the checks API, where `./agent pr-checks`
            # reads them without downloading a log.
            jq -r -f "$RUNNER_TEMP/annotate.jq" "$summary"
          done
          if [ "$PARTITION_RESULT" != success ]; then
            echo "At least one partition did not succeed ($PARTITION_RESULT); its artifact holds the logs."
            status=1
          fi
          exit $status
