<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="40" y="34" font-weight="700" fill="#222" font-size="14">The companion app: pen and touch on the same session</text>

  <!-- iPad -->
  <text x="40" y="66" fill="#444" font-weight="600">iPad · companion app · paired</text>
  <rect x="40" y="76" width="430" height="310" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="54" y="90" width="402" height="282" rx="4" fill="#fbfbfb" stroke="#ddd"/>
  <!-- small app cell on the ipad canvas -->
  <rect x="66" y="104" width="110" height="200" rx="10" fill="#fff" stroke="#333"/>
  <rect x="72" y="112" width="98" height="18" fill="#f2f2f2"/>
  <g stroke="#333" fill="#e6e6e6">
    <rect x="74" y="140" width="22" height="22" rx="3"/>
    <rect x="74" y="172" width="22" height="22" rx="3"/>
    <rect x="74" y="204" width="22" height="22" rx="3"/>
  </g>
  <g stroke="#bbb"><line x1="102" y1="148" x2="160" y2="148"/><line x1="102" y1="180" x2="160" y2="180"/><line x1="102" y1="212" x2="160" y2="212"/></g>
  <!-- ink stroke being drawn (imperfect rectangle) -->
  <path d="M206,150 C260,146 330,148 396,152 C398,190 396,210 394,226 C330,230 262,228 208,226 C204,200 206,172 206,150 Z" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="212" y="142" fill="#c0392b" font-size="10">draw &amp; hold → a clean sketch</text>
  <!-- pencil -->
  <g transform="translate(396,152) rotate(-40)">
    <rect x="0" y="-5" width="120" height="10" rx="3" fill="#eee" stroke="#333"/>
    <path d="M0,-5 L-14,0 L0,5 Z" fill="#333"/>
  </g>
  <!-- palette strip -->
  <rect x="54" y="336" width="402" height="36" fill="#f0f0f0" stroke="#ddd"/>
  <g fill="#fff" stroke="#333">
    <rect x="64" y="344" width="56" height="20" rx="10"/><rect x="128" y="344" width="56" height="20" rx="10"/><rect x="192" y="344" width="56" height="20" rx="10"/><rect x="256" y="344" width="80" height="20" rx="10"/>
  </g>
  <g fill="#222" font-size="10" text-anchor="middle">
    <text x="92" y="358">Text</text><text x="156" y="358">Image</text><text x="220" y="358">Button</text><text x="296" y="358">Playlist ▾</text>
  </g>
  <text x="352" y="358" fill="#777" font-size="10">undo  ·  snap</text>

  <!-- link -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M478,200 L536,200" marker-end="url(#arrow)"/>
    <path d="M536,230 L478,230" marker-end="url(#arrow)"/>
  </g>
  <text x="507" y="190" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="600">source actions</text>
  <text x="507" y="252" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="600">compiled cells</text>
  <text x="507" y="266" text-anchor="middle" fill="#888" font-size="10">one paired session</text>

  <!-- Mac studio -->
  <text x="546" y="66" fill="#444" font-weight="600">Mac · Tao Studio</text>
  <rect x="546" y="76" width="314" height="310" rx="8" fill="#fafafa" stroke="#999"/>
  <rect x="546" y="76" width="314" height="26" rx="8" fill="#eeeeee" stroke="#999"/>
  <text x="560" y="94" fill="#222" font-size="11" font-weight="600">Playlists — Design</text>
  <rect x="560" y="116" width="80" height="140" rx="8" fill="#fff" stroke="#333"/>
  <rect x="656" y="140" width="190" height="42" fill="#fff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="660" y="134" fill="#444" font-size="10" font-weight="600">Untitled1 · sketch</text>
  <text x="662" y="200" fill="#777" font-size="10">appears as it is drawn</text>
  <rect x="560" y="272" width="286" height="100" rx="6" fill="#f7f7f7" stroke="#bbb"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#222">
    <text x="568" y="290">view Untitled1() {</text>
    <text x="568" y="304">   render Sketch [width 380, height 84] { }</text>
    <text x="568" y="318">}</text>
    <text x="568" y="340">// the Mac compiles; the iPad renders its cell</text>
    <text x="568" y="354">// at true scale and sends typed actions back</text>
  </g>

  <g fill="#333" font-size="11">
    <text x="40" y="416">· pencil draws and writes; a finger moves, selects, and pans — the platform's own convention</text>
    <text x="40" y="434">· scribble inside a box to make it Text with that content; tap a box to retype it from the strip</text>
    <text x="40" y="452">· one cell per device until runtime state is instance-scoped: the iPad steps through a group, the iPhone shows one at true size</text>
    <text x="40" y="470">· the device never compiles or owns source: every change is a source action the Mac validates, applies, and echoes back</text>
  </g>
</svg>
