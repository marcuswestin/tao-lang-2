<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>
  <text x="40" y="34" font-weight="700" fill="#222" font-size="14">Focus into the row that is everywhere</text>

  <!-- phone cell -->
  <text x="40" y="70" fill="#444" font-weight="600">Playlists · phone · "full"</text>
  <rect x="40" y="80" width="220" height="380" rx="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <rect x="50" y="96" width="200" height="30" fill="#f2f2f2"/>
  <text x="60" y="116" font-weight="600" fill="#222">Playlists</text>
  <g stroke="#333" fill="#e6e6e6">
    <rect x="54" y="140" width="40" height="40" rx="4"/>
    <rect x="54" y="196" width="40" height="40" rx="4"/>
    <rect x="54" y="252" width="40" height="40" rx="4"/>
    <rect x="54" y="308" width="40" height="40" rx="4"/>
  </g>
  <g fill="#222">
    <text x="104" y="155">Chill Vibes</text><text x="104" y="172" fill="#777" font-size="11">32 tracks · 2 h 05</text>
    <text x="104" y="211">Morning Run</text><text x="104" y="228" fill="#777" font-size="11">18 tracks · 1 h 10</text>
    <text x="104" y="267">Deep Focus</text><text x="104" y="284" fill="#777" font-size="11">40 tracks · 3 h 20</text>
    <text x="104" y="323">Road Trip</text><text x="104" y="340" fill="#777" font-size="11">57 tracks · 4 h 02</text>
  </g>
  <!-- selection on row 2 -->
  <rect x="48" y="190" width="204" height="52" fill="none" stroke="#c0392b" stroke-width="2"/>
  <rect x="120" y="244" width="130" height="44" rx="6" fill="#fff" stroke="#333"/>
  <text x="130" y="262" fill="#222" font-size="11">PlaylistRow</text>
  <text x="130" y="278" fill="#c0392b" font-size="11" font-weight="600">Edit as a sketch ⏎</text>
  <text x="200" y="262" fill="#777" font-size="11">edit here</text>

  <!-- arrow to sketch -->
  <path d="M256,216 C300,216 300,150 330,150" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the definition sketch -->
  <text x="330" y="128" fill="#444" font-weight="600">PlaylistRow(Playlist) · "fromPlaylists"</text>
  <text x="330" y="142" fill="#777" font-size="11">arguments captured from the running cell: Playlist = Morning Run</text>
  <rect x="330" y="150" width="520" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <rect x="346" y="168" width="60" height="60" rx="6" fill="#d8d8d8" stroke="#333"/>
  <text x="424" y="186" fill="#222" font-weight="600" font-size="15">Morning Run</text>
  <text x="424" y="206" fill="#777" font-size="12">18 tracks · 1 h 10</text>
  <!-- new free box under the title -->
  <rect x="424" y="218" width="150" height="16" fill="#fdf1ef" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="430" y="230" fill="#c0392b" font-size="10">new box → Owner.Name</text>
  <text x="760" y="212" fill="#222" font-size="12">1 h 10</text>

  <!-- propagation arrows -->
  <g stroke="#888" stroke-width="1.5" fill="none">
    <path d="M330,240 C300,240 280,160 256,160" marker-end="url(#arrowgrey)"/>
    <path d="M330,244 C300,260 280,272 256,272" marker-end="url(#arrowgrey)"/>
    <path d="M330,248 C300,300 280,328 256,328" marker-end="url(#arrowgrey)"/>
  </g>
  <text x="295" y="400" fill="#888" font-size="10" text-anchor="middle">every instance</text>
  <text x="295" y="414" fill="#888" font-size="10" text-anchor="middle">updates live</text>

  <!-- source -->
  <rect x="330" y="292" width="520" height="134" rx="6" fill="#f7f7f7" stroke="#bbb"/>
  <text x="340" y="312" fill="#555" font-size="11">Studio wrote one scenario entry for the sketch, and the new box is source like any other:</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#222">
    <text x="340" y="334">scenarios PlaylistRow "sketches" {</text>
    <text x="340" y="350">   fixture Sketches; device phone</text>
    <text x="340" y="366">   scenario "fromPlaylists" { render (Playlist: MorningRun) }  // captured</text>
    <text x="340" y="382">}</text>
    <text x="340" y="398">Col [gap 10, claim 1] {</text>
    <text x="340" y="414">   Text(Playlist.Title) [body]; Placeholder("Owner") [width 150, height 16]; … }</text>
  </g>

  <g fill="#333" font-size="11">
    <text x="330" y="452">· "edit here" edits the same definition in place, inside the app cell — the sketch is a choice, not a mode</text>
    <text x="330" y="470">· a sketch opened from an instance is pinned to that instance's arguments, so what you see is what the app showed</text>
    <text x="330" y="488">· the sketch stays a scenario cell; close it, and its entry remains in source unless you discard it</text>
  </g>
</svg>
