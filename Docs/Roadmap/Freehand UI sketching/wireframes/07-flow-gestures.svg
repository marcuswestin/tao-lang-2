<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>
  <text x="40" y="34" font-weight="700" fill="#222" font-size="14">Editing a flowing sketch without leaving the canvas</text>

  <!-- panel A: insert separator -->
  <text x="40" y="70" fill="#444" font-weight="600">A · ⌥-click a gap: insert</text>
  <rect x="40" y="80" width="190" height="90" fill="#fff" stroke="#222"/>
  <g fill="#e9e9e9" stroke="#333">
    <rect x="52" y="100" width="50" height="50"/>
    <rect x="120" y="106" width="98" height="14"/>
    <rect x="120" y="130" width="70" height="12"/>
  </g>
  <line x1="111" y1="92" x2="111" y2="158" stroke="#c0392b" stroke-width="2"/>
  <circle cx="111" cy="125" r="7" fill="#c0392b"/><text x="111" y="129" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">+</text>
  <text x="40" y="190" fill="#666" font-size="11">a divider, a spacer, or a new</text>
  <text x="40" y="204" fill="#666" font-size="11">element from the palette, in place</text>

  <!-- panel B: toggle direction -->
  <text x="250" y="70" fill="#444" font-weight="600">B · ⌘-click a container: turn</text>
  <rect x="250" y="80" width="190" height="90" fill="#fff" stroke="#222"/>
  <g fill="#e9e9e9" stroke="#333">
    <rect x="262" y="92" width="166" height="18"/>
    <rect x="262" y="118" width="166" height="14"/>
    <rect x="262" y="140" width="110" height="12"/>
  </g>
  <rect x="380" y="86" width="52" height="16" rx="8" fill="#c0392b"/><text x="406" y="98" text-anchor="middle" fill="#fff" font-size="10">Row→Col</text>
  <text x="250" y="190" fill="#666" font-size="11">Row ↔ Col; content and gap</text>
  <text x="250" y="204" fill="#666" font-size="11">swap axes with it</text>

  <!-- panel C: reorder -->
  <text x="460" y="70" fill="#444" font-weight="600">C · drag an item: reorder</text>
  <rect x="460" y="80" width="190" height="90" fill="#fff" stroke="#222"/>
  <g fill="#e9e9e9" stroke="#333">
    <rect x="472" y="100" width="50" height="50"/>
    <rect x="540" y="106" width="98" height="14"/>
  </g>
  <rect x="540" y="130" width="70" height="12" fill="#fdf1ef" stroke="#c0392b" stroke-dasharray="4 3"/>
  <line x1="532" y1="98" x2="532" y2="152" stroke="#c0392b" stroke-width="2"/>
  <path d="M575,136 C560,136 548,124 536,124" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="190" fill="#666" font-size="11">the gap it lands in is the</text>
  <text x="460" y="204" fill="#666" font-size="11">existing move-render action</text>

  <!-- panel D: sizing handles -->
  <text x="670" y="70" fill="#444" font-weight="600">D · drag an edge: size</text>
  <rect x="670" y="80" width="190" height="90" fill="#fff" stroke="#222"/>
  <g fill="#e9e9e9" stroke="#333">
    <rect x="682" y="100" width="50" height="50"/>
    <rect x="750" y="106" width="98" height="14"/>
    <rect x="750" y="130" width="70" height="12"/>
  </g>
  <rect x="844" y="102" width="8" height="22" rx="2" fill="#c0392b"/>
  <text x="670" y="190" fill="#666" font-size="11">to the edge → fill · back → hug</text>
  <text x="670" y="204" fill="#666" font-size="11">anywhere else → width N</text>

  <!-- footer mapping -->
  <rect x="40" y="228" width="820" height="112" rx="6" fill="#f7f7f7" stroke="#bbb"/>
  <text x="52" y="248" fill="#444" font-weight="600">Each gesture is one existing or new typed source action</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#222">
    <text x="52" y="270">A  insert-component / insert-project-view at a render gap        (exists)</text>
    <text x="52" y="286">B  set-container-direction Row ↔ Col, remapping content terms     (new)</text>
    <text x="52" y="302">C  move-render draggedId → beforeId / afterId                      (exists)</text>
    <text x="52" y="318">D  set-layout-entry width fill | hug | width 120                   (exists)</text>
  </g>
  <text x="52" y="336" fill="#666" font-size="11">Modifier keys are the desktop spelling; the companion app maps the same actions to long-press and two-finger gestures.</text>
</svg>
