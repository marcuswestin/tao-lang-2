appId: ${TAO_HOST_TEST_APP}
---
# The test-only deep-link control is installed before Maestro starts. This flow proves its result
# through visible application text, then uses a real native tap for the time transition.
- launchApp
- assertVisible: "Clockwork"
- assertVisible: "Host ready: run ${TAO_HOST_TEST_RUN_ID} · seed ${TAO_HOST_TEST_SEED} · wall 1767258000000 · monotonic 0"
- assertVisible: "Countdown: 0:10"
- assertVisible: "Choice: ${TAO_HOST_TEST_CLOCKWORK_INITIAL_COLOR}"
- tapOn: "Choose clockwork color"
- assertVisible: "Choice: ${TAO_HOST_TEST_CLOCKWORK_FIRST_COLOR}"
- tapOn: "Choose clockwork color"
- assertVisible: "Choice: ${TAO_HOST_TEST_CLOCKWORK_SECOND_COLOR}"
- openLink: "taohostpoc-${TAO_HOST_TEST_RUN_ID}://control?runId=${TAO_HOST_TEST_RUN_ID}&advanceMs=1000"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "Control received: advance 1000ms"
- assertVisible: "Countdown: 0:09"
