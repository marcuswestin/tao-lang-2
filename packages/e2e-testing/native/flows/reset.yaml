appId: ${TAO_HOST_TEST_APP}
---
# Only the isolated PoC bundle ID reaches this cleanup step. The journey flow itself never clears
# state, which lets it make a real terminate/relaunch persistence assertion.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Cancel"
- assertNotVisible: "Open"
- launchApp:
    clearState: true
- killApp
